version: '3.9'

services:
  # ─── MongoDB Database ──────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: skillsync_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: skillsync
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - skillsync_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Backend API ──────────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: skillsync_server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/skillsync
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ALLOWED_ORIGINS: http://localhost,http://client
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - skillsync_network

  # ─── Frontend (Nginx) ─────────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    container_name: skillsync_client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
    networks:
      - skillsync_network

networks:
  skillsync_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local
